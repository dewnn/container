name: Bug report
description: Report reproducible incorrect behavior in CONTAINER
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a problem. Do not upload private media.
  - type: input
    id: version
    attributes:
      label: CONTAINER version
      placeholder: v0.2.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: dropdown
    id: workspace
    attributes:
      label: Workspace
      options: [Toolbox, SmartCut, Batch, Startup or installation]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the selected tool, parameters and input media properties.
      placeholder: |
        1. Open a 1920x1080 H.264 MP4...
        2. Select...
        3. Click...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and logs
      description: Remove usernames, private paths and private filenames before pasting logs.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I tested the latest release.
          required: true
        - label: I removed private information from screenshots and logs.
          required: true
