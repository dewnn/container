name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed files
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.paths.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check whether Rust validation is needed
        id: paths
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Unknown history must run all checks, never silently skip them.
          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo 'rust=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only -z "$BASE" "$HEAD" > "$RUNNER_TEMP/changed-paths"
          rust=false
          while IFS= read -r -d '' path; do
            case "$path" in
              src/*|public/*|docs/*|README*|LICENSE*|index.html|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|svelte.config.*|vite.config.*|tsconfig*.json)
                ;;
              *) rust=true ;;
            esac
          done < "$RUNNER_TEMP/changed-paths"
          echo "rust=$rust" >> "$GITHUB_OUTPUT"

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build

  rust:
    name: Rust checks
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install FFmpeg
        shell: pwsh
        run: |
          $config = @{}
          Get-Content config/bundled-tools.env | ForEach-Object {
            $key, $value = $_ -split '=', 2
            $config[$key] = $value
          }
          choco install ffmpeg-full --version $config.FFMPEG_VERSION --yes --no-progress
          $tools = Join-Path $env:ChocolateyInstall 'lib\ffmpeg-full\tools'
          $ffmpeg = Get-ChildItem -Path $tools -Recurse -Filter 'ffmpeg.exe' -File |
            Where-Object Length -GT 1MB |
            Sort-Object Length -Descending |
            Select-Object -First 1
          $ffprobe = Get-ChildItem -Path $tools -Recurse -Filter 'ffprobe.exe' -File |
            Where-Object Length -GT 1MB |
            Sort-Object Length -Descending |
            Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) { throw "Real FFmpeg binaries were not found under $tools." }
          $ffmpeg.DirectoryName >> $env:GITHUB_PATH
      - name: Prepare verified yt-dlp
        shell: pwsh
        run: |
          $config = @{}
          Get-Content config/bundled-tools.env | ForEach-Object {
            $key, $value = $_ -split '=', 2
            $config[$key] = $value
          }
          $url = "https://github.com/yt-dlp/yt-dlp/releases/download/$($config.YT_DLP_VERSION)/yt-dlp.exe"
          $path = Join-Path $env:RUNNER_TEMP 'yt-dlp.exe'
          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $path
          $expected = $config.YT_DLP_SHA256
          $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "yt-dlp checksum mismatch: $actual" }
          "CONTAINER_YT_DLP=$path" >> $env:GITHUB_ENV
      - name: Prepare verified Deno runtime
        shell: pwsh
        run: |
          $config = @{}
          Get-Content config/bundled-tools.env | ForEach-Object {
            $key, $value = $_ -split '=', 2
            $config[$key] = $value
          }
          $url = "https://github.com/denoland/deno/releases/download/v$($config.DENO_VERSION)/deno-x86_64-pc-windows-msvc.zip"
          $archive = Join-Path $env:RUNNER_TEMP 'deno.zip'
          $directory = Join-Path $env:RUNNER_TEMP 'deno-runtime'
          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $config.DENO_SHA256) { throw "Deno checksum mismatch: $actual" }
          Expand-Archive -LiteralPath $archive -DestinationPath $directory
          "CONTAINER_DENO=$(Join-Path $directory 'deno.exe')" >> $env:GITHUB_ENV
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          shared-key: windows-cargo
      - name: Create frontend placeholder for Tauri checks
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Set-Content -Path dist/index.html -Value '<!doctype html><title>CONTAINER CI</title>'
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets
      - run: cargo test --manifest-path src-tauri/Cargo.toml
