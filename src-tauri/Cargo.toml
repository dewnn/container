[package]
name = "container-studio"
version = "0.5.2"
description = "CONTAINER FFmpeg media toolbox"
authors = ["dewn"]
edition = "2021"
publish = false
license = "MIT"
homepage = "https://github.com/dewnn/container"
repository = "https://github.com/dewnn/container"

[lib]
name = "container_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "image-png", "image-ico"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
dirs = "6"
voice_activity_detector = "0.2"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "rt-multi-thread"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
