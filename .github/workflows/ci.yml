name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build

  rust:
    name: Rust checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install FFmpeg
        shell: pwsh
        run: |
          choco install ffmpeg-full --version 9.0.1 --yes --no-progress
          $tools = Join-Path $env:ChocolateyInstall 'lib\ffmpeg-full\tools'
          $ffmpeg = Get-ChildItem -Path $tools -Recurse -Filter 'ffmpeg.exe' -File |
            Where-Object Length -GT 1MB |
            Sort-Object Length -Descending |
            Select-Object -First 1
          $ffprobe = Get-ChildItem -Path $tools -Recurse -Filter 'ffprobe.exe' -File |
            Where-Object Length -GT 1MB |
            Sort-Object Length -Descending |
            Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) { throw "Real FFmpeg binaries were not found under $tools." }
          $ffmpeg.DirectoryName >> $env:GITHUB_PATH
          $sidecarDir = Join-Path $PWD 'src-tauri\binaries'
          New-Item -ItemType Directory -Force $sidecarDir | Out-Null
          Copy-Item -LiteralPath $ffmpeg.FullName -Destination (Join-Path $sidecarDir 'ffmpeg-x86_64-pc-windows-msvc.exe')
          Copy-Item -LiteralPath $ffprobe.FullName -Destination (Join-Path $sidecarDir 'ffprobe-x86_64-pc-windows-msvc.exe')
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - name: Create frontend placeholder for Tauri checks
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Set-Content -Path dist/index.html -Value '<!doctype html><title>CONTAINER CI</title>'
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets
      - run: cargo test --manifest-path src-tauri/Cargo.toml
