name: Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install FFmpeg
        shell: pwsh
        run: |
          $config = @{}
          Get-Content config/bundled-tools.env | ForEach-Object {
            $key, $value = $_ -split '=', 2
            $config[$key] = $value
          }
          choco install ffmpeg-full --version $config.FFMPEG_VERSION --yes --no-progress
          $tools = Join-Path $env:ChocolateyInstall 'lib\ffmpeg-full\tools'
          $ffmpeg = Get-ChildItem -Path $tools -Recurse -Filter 'ffmpeg.exe' -File |
            Where-Object Length -GT 1MB |
            Sort-Object Length -Descending |
            Select-Object -First 1
          $ffprobe = Get-ChildItem -Path $tools -Recurse -Filter 'ffprobe.exe' -File |
            Where-Object Length -GT 1MB |
            Sort-Object Length -Descending |
            Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) { throw "Real FFmpeg binaries were not found under $tools." }
          $ffmpeg.DirectoryName >> $env:GITHUB_PATH

      - name: Prepare verified yt-dlp
        shell: pwsh
        run: |
          $config = @{}
          Get-Content config/bundled-tools.env | ForEach-Object {
            $key, $value = $_ -split '=', 2
            $config[$key] = $value
          }
          $url = "https://github.com/yt-dlp/yt-dlp/releases/download/$($config.YT_DLP_VERSION)/yt-dlp.exe"
          $path = Join-Path $env:RUNNER_TEMP 'yt-dlp.exe'
          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $path
          $expected = $config.YT_DLP_SHA256
          $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "yt-dlp checksum mismatch: $actual" }
          "CONTAINER_YT_DLP=$path" >> $env:GITHUB_ENV

      - name: Prepare verified Deno runtime
        shell: pwsh
        run: |
          $config = @{}
          Get-Content config/bundled-tools.env | ForEach-Object {
            $key, $value = $_ -split '=', 2
            $config[$key] = $value
          }
          $url = "https://github.com/denoland/deno/releases/download/v$($config.DENO_VERSION)/deno-x86_64-pc-windows-msvc.zip"
          $archive = Join-Path $env:RUNNER_TEMP 'deno.zip'
          $directory = Join-Path $env:RUNNER_TEMP 'deno-runtime'
          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $config.DENO_SHA256) { throw "Deno checksum mismatch: $actual" }
          Expand-Archive -LiteralPath $archive -DestinationPath $directory
          "CONTAINER_DENO=$(Join-Path $directory 'deno.exe')" >> $env:GITHUB_ENV

      - name: Verify release versions
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $cargoVersion = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ($tag -ne $packageVersion -or $tag -ne $tauriVersion -or $tag -ne $cargoVersion) {
            throw "Tag v$tag must match package.json ($packageVersion), tauri.conf.json ($tauriVersion), and Cargo.toml ($cargoVersion)."
          }

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build application and full Windows setup
        run: pnpm tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Assemble release assets
        id: assets
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $releaseDir = Join-Path $PWD 'release-assets'
          $updaterDir = Join-Path $PWD 'updater-manifest'
          New-Item -ItemType Directory -Force $releaseDir | Out-Null
          New-Item -ItemType Directory -Force $updaterDir | Out-Null

          $app = Get-ChildItem src-tauri/target/release -Filter '*.exe' -File |
            Where-Object Name -NotMatch '^(ffmpeg|ffprobe|yt-dlp|deno)' |
            Select-Object -First 1
          if (-not $app) { throw 'Portable application executable was not found.' }

          $portableDir = Join-Path $PWD 'portable-package'
          New-Item -ItemType Directory -Force $portableDir | Out-Null
          Copy-Item -LiteralPath $app.FullName -Destination (Join-Path $portableDir 'CONTAINER.exe')
          $sidecarRoot = Join-Path $PWD 'src-tauri\binaries'
          $ffmpegSidecar = Get-ChildItem $sidecarRoot -Filter 'ffmpeg-*-windows-msvc.exe' -File | Select-Object -First 1
          $ffprobeSidecar = Get-ChildItem $sidecarRoot -Filter 'ffprobe-*-windows-msvc.exe' -File | Select-Object -First 1
          $ytDlpSidecar = Get-ChildItem $sidecarRoot -Filter 'yt-dlp-*-windows-msvc.exe' -File | Select-Object -First 1
          $denoSidecar = Get-ChildItem $sidecarRoot -Filter 'deno-*-windows-msvc.exe' -File | Select-Object -First 1
          if (-not $ffmpegSidecar -or -not $ffprobeSidecar -or -not $ytDlpSidecar -or -not $denoSidecar) { throw 'Bundled media sidecars were not prepared.' }
          Copy-Item -LiteralPath $ffmpegSidecar.FullName -Destination (Join-Path $portableDir 'ffmpeg.exe')
          Copy-Item -LiteralPath $ffprobeSidecar.FullName -Destination (Join-Path $portableDir 'ffprobe.exe')
          Copy-Item -LiteralPath $ytDlpSidecar.FullName -Destination (Join-Path $portableDir 'yt-dlp.exe')
          Copy-Item -LiteralPath $denoSidecar.FullName -Destination (Join-Path $portableDir 'deno.exe')
          Copy-Item -LiteralPath 'docs\THIRD_PARTY_NOTICES.md' -Destination (Join-Path $portableDir 'THIRD_PARTY_NOTICES.md')
          Copy-Item -LiteralPath 'src-tauri\resources\yt-dlp-LICENSE.txt' -Destination (Join-Path $portableDir 'yt-dlp-LICENSE.txt')
          Copy-Item -LiteralPath 'src-tauri\resources\yt-dlp-THIRD_PARTY_LICENSES.txt' -Destination (Join-Path $portableDir 'yt-dlp-THIRD_PARTY_LICENSES.txt')
          Copy-Item -LiteralPath 'src-tauri\resources\deno-LICENSE.md' -Destination (Join-Path $portableDir 'deno-LICENSE.md')
          Compress-Archive -Path (Join-Path $portableDir '*') -DestinationPath (Join-Path $releaseDir "CONTAINER-Portable-$version-x64.zip") -CompressionLevel Optimal

          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*.exe' -File | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not found.' }
          $setupPath = Join-Path $releaseDir "CONTAINER-Setup-$version-x64.exe"
          Copy-Item -LiteralPath $installer.FullName -Destination $setupPath
          $signaturePath = "$($installer.FullName).sig"
          if (-not (Test-Path -LiteralPath $signaturePath)) { throw 'Signed updater manifest was not created.' }
          Copy-Item -LiteralPath $signaturePath -Destination (Join-Path $updaterDir 'full-setup.sig')

          $changelog = Get-Content docs/CHANGELOG.md
          $start = -1
          $end = $changelog.Count
          for ($i = 0; $i -lt $changelog.Count; $i++) {
            if ($changelog[$i] -match "^## \[$([regex]::Escape($version))\]") {
              $start = $i
              break
            }
          }
          if ($start -lt 0) { throw "No changelog entry was found for version $version." }
          for ($i = $start + 1; $i -lt $changelog.Count; $i++) {
            if ($changelog[$i] -match '^## \[') {
              $end = $i
              break
            }
          }
          $releaseNotes = @('# Changes', '')
          if ($end -gt ($start + 1)) {
            $releaseNotes += $changelog[($start + 1)..($end - 1)]
          }
          Set-Content -Path release-notes.md -Value $releaseNotes

          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Assemble updater manifest
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $updaterDir = Join-Path $PWD 'updater-manifest'
          $signaturePath = Join-Path $updaterDir 'full-setup.sig'
          if (-not (Test-Path -LiteralPath $signaturePath)) { throw 'Setup updater signature was not created.' }

          $changelog = Get-Content docs/CHANGELOG.md
          $start = -1
          $end = $changelog.Count
          for ($i = 0; $i -lt $changelog.Count; $i++) {
            if ($changelog[$i] -match "^## \[$([regex]::Escape($version))\]") { $start = $i; break }
          }
          if ($start -lt 0) { throw "No changelog entry was found for version $version." }
          for ($i = $start + 1; $i -lt $changelog.Count; $i++) {
            if ($changelog[$i] -match '^## \[') { $end = $i; break }
          }
          $releaseNotes = @('# Changes', '')
          if ($end -gt ($start + 1)) { $releaseNotes += $changelog[($start + 1)..($end - 1)] }

          $signature = (Get-Content -LiteralPath $signaturePath -Raw).Trim()
          $downloadName = "CONTAINER-Setup-$version-x64.exe"
          $manifest = @{
            version = $version
            notes = ($releaseNotes -join "`n")
            pub_date = (Get-Date).ToUniversalTime().ToString('o')
            platforms = @{
              'windows-x86_64' = @{
                signature = $signature
                url = "https://github.com/dewnn/container/releases/download/v$version/$downloadName"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path (Join-Path $updaterDir 'latest.json')

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CONTAINER-Windows-${{ steps.assets.outputs.version }}
          path: release-assets/*

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: CONTAINER ${{ github.ref_name }}
          draft: false
          prerelease: false
          body_path: release-notes.md
          files: release-assets/*

      - name: Publish updater manifest outside Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $manifestPath = Join-Path $PWD 'updater-manifest\latest.json'
          if (-not (Test-Path -LiteralPath $manifestPath)) { throw 'Updater manifest was not created.' }

          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GITHUB_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $uri = "https://api.github.com/repos/${{ github.repository }}/contents/latest.json"
          $existing = Invoke-RestMethod -Uri "$uri`?ref=updater" -Headers $headers
          $payload = @{
            message = "release: update manifest to ${{ github.ref_name }}"
            content = [Convert]::ToBase64String([IO.File]::ReadAllBytes($manifestPath))
            branch = 'updater'
            sha = $existing.sha
          } | ConvertTo-Json
          Invoke-RestMethod -Method Put -Uri $uri -Headers $headers -ContentType 'application/json' -Body $payload | Out-Null
